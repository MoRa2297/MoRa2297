<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="beam" cx="0.5" cy="0" r="0.9">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>
  </defs>

  <!-- Sky background -->
  <rect width="900" height="200" fill="url(#sky)"/>

  <!-- Moon -->
  <circle cx="780" cy="50" r="22" fill="url(#moon)" opacity="0.9"/>
  <circle cx="774" cy="45" r="3" fill="#94A3B8" opacity="0.4"/>
  <circle cx="786" cy="55" r="2" fill="#94A3B8" opacity="0.4"/>
  <circle cx="782" cy="42" r="1.5" fill="#94A3B8" opacity="0.4"/>

  <!-- Twinkling stars -->
  <g fill="#F8FAFC">
    <circle cx="80"  cy="30"  r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="70"  r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="35"  r="1.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="80"  r="0.9"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="40"  r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="60"  r="1"><animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="25"  r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="90"  r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="85"  r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="95"  r="0.9"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="95"  r="0.8"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="95"  r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Mountain silhouette background -->
  <path d="M0,160 L100,110 L180,140 L260,95 L360,130 L460,100 L560,135 L660,105 L760,125 L900,110 L900,200 L0,200 Z" fill="#0F172A" opacity="0.8"/>
  <!-- Ground -->
  <path d="M0,170 Q150,155 300,165 T600,160 T900,170 L900,200 L0,200 Z" fill="#020617"/>

  <!-- Drone flying across the sky -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-120,0; 1020,0" dur="10s" repeatCount="indefinite"/>
    <g transform="translate(0,100)">
      <!-- Drone shadow on ground -->
      <ellipse cx="0" cy="70" rx="20" ry="3" fill="#000" opacity="0.3"/>

      <!-- Body -->
      <rect x="-16" y="-5" width="32" height="10" rx="3" fill="#38BDF8"/>
      <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#0EA5E9"/>

      <!-- Arms -->
      <line x1="-14" y1="-2" x2="-32" y2="-14" stroke="#475569" stroke-width="2.5"/>
      <line x1="14"  y1="-2" x2="32"  y2="-14" stroke="#475569" stroke-width="2.5"/>
      <line x1="-14" y1="2"  x2="-32" y2="14"  stroke="#475569" stroke-width="2.5"/>
      <line x1="14"  y1="2"  x2="32"  y2="14"  stroke="#475569" stroke-width="2.5"/>

      <!-- Motor hubs -->
      <circle cx="-32" cy="-14" r="3" fill="#1E293B"/>
      <circle cx="32"  cy="-14" r="3" fill="#1E293B"/>
      <circle cx="-32" cy="14"  r="3" fill="#1E293B"/>
      <circle cx="32"  cy="14"  r="3" fill="#1E293B"/>

      <!-- Spinning rotors -->
      <ellipse cx="-32" cy="-14" rx="12" ry="2" fill="#94A3B8" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0 -32 -14" to="360 -32 -14" dur="0.12s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="32" cy="-14" rx="12" ry="2" fill="#94A3B8" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0 32 -14" to="360 32 -14" dur="0.12s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="-32" cy="14" rx="12" ry="2" fill="#94A3B8" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0 -32 14" to="360 -32 14" dur="0.12s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="32" cy="14" rx="12" ry="2" fill="#94A3B8" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0 32 14" to="360 32 14" dur="0.12s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Camera gimbal -->
      <rect x="-4" y="5" width="8" height="6" rx="1" fill="#1E293B"/>
      <circle cx="0" cy="9" r="2.5" fill="#0F172A" stroke="#38BDF8" stroke-width="0.5"/>

      <!-- Navigation LEDs -->
      <circle cx="-16" cy="0" r="1.5" fill="#22C55E">
        <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="16" cy="0" r="1.5" fill="#F43F5E">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" repeatCount="indefinite"/>
      </circle>

      <!-- Scanning beam -->
      <path d="M0,10 L-50,70 L50,70 Z" fill="url(#beam)"/>
    </g>
  </g>
</svg>
